<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly rides by city</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Monthly rides by city</h1>
    <nav><a href="./index.html">Home</a><a href="./monthly.html">Monthly</a></nav>
  </header>
  <main>
    <p id="status" aria-live="polite">Loading data&hellip;</p>
    <section>
      <ul id="legend" class="legend"></ul>
      <svg id="chart" class="stacked-chart" viewBox="0 0 600 320" role="img" aria-labelledby="chart-title">
        <title id="chart-title">Stacked bar chart of monthly rides by city</title>
      </svg>
      <table id="monthly">
        <thead><tr><th>Month</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script type="module">
    import { parseCsv } from "./src/csv.js";
    import { monthlyRidesByCity, monthLabel } from "./src/stats.js";
    import { layoutStackedBars } from "./src/chart.js";

    const status = document.getElementById("status");
    const table = document.getElementById("monthly");
    const legend = document.getElementById("legend");
    const chart = document.getElementById("chart");

    // Plot area inside the 600x320 viewBox, leaving room for axis labels.
    const margin = { top: 10, right: 10, bottom: 30, left: 72 };
    const plot = { width: 600 - margin.left - margin.right, height: 320 - margin.top - margin.bottom };
    const SERIES_COUNT = 6; // colour classes defined in style.css

    const cell = (tag, text) => {
      const el = document.createElement(tag);
      el.textContent = text;
      return el;
    };

    const svg = (tag, attrs, text) => {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, value);
      if (text !== undefined) el.textContent = text;
      return el;
    };

    let rows;
    try {
      const response = await fetch("./data/rides.csv");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      rows = parseCsv(await response.text());
    } catch {
      table.closest("section").remove();
      status.textContent = "Could not load ride data";
    }

    if (rows) {
      const months = monthlyRidesByCity(rows);
      const cityNames = (months[0]?.cities ?? []).map((c) => c.city);
      const seriesClass = (city) => `series-${cityNames.indexOf(city) % SERIES_COUNT}`;

      for (const city of cityNames) {
        const swatch = document.createElement("span");
        swatch.className = `swatch ${seriesClass(city)}`;
        const item = document.createElement("li");
        item.append(swatch, city);
        legend.appendChild(item);
      }

      const layout = layoutStackedBars(months, plot);
      const g = svg("g", { transform: `translate(${margin.left} ${margin.top})` });
      for (const { value, y } of layout.gridlines) {
        g.appendChild(svg("line", { class: "gridline", x1: 0, x2: plot.width, y1: y, y2: y }));
        g.appendChild(svg("text", { class: "axis-label", x: -8, y, "text-anchor": "end", "dominant-baseline": "middle" }, value.toLocaleString("en-US")));
      }
      for (const { month, x, width, segments } of layout.bars) {
        for (const segment of segments) {
          const rect = svg("rect", { class: seriesClass(segment.city), x: segment.x, y: segment.y, width: segment.width, height: segment.height });
          rect.appendChild(svg("title", {}, `${segment.city}, ${monthLabel(month)}: ${segment.rides.toLocaleString("en-US")}`));
          g.appendChild(rect);
        }
        g.appendChild(svg("text", { class: "axis-label", x: x + width / 2, y: plot.height + 20, "text-anchor": "middle" }, monthLabel(month)));
      }
      chart.appendChild(g);

      const headRow = table.querySelector("thead tr");
      for (const { city } of months[0]?.cities ?? []) headRow.appendChild(cell("th", city));
      headRow.appendChild(cell("th", "Total"));

      const tbody = table.querySelector("tbody");
      for (const { month, cities, total } of months) {
        const tr = document.createElement("tr");
        tr.appendChild(cell("th", monthLabel(month)));
        for (const { rides } of cities) tr.appendChild(cell("td", rides.toLocaleString("en-US")));
        tr.appendChild(cell("td", total.toLocaleString("en-US")));
        tbody.appendChild(tr);
      }
      status.remove();
    }
  </script>
</body>
</html>
